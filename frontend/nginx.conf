# Two entry points to the same app, differing in one thing: whether the admin
# configuration can be written.
#
#   :80    private. Reached only through an SSH tunnel to the host, so whoever
#          holds the server's SSH key gets the app exactly as it has always
#          behaved, admin panel included.
#   :8081  public. What the Cloudflare tunnel points at. Identical, except that
#          writes to /api/admin-config are refused.
#
# The reason for the split: POST/PUT /api/admin-config is the only write endpoint
# in the API and it has no authentication of its own (see backend/app.py). It
# stores the whole configuration object -- layer setup, border edits -- so on a
# public link, any visitor could rewrite the map for everyone. Splitting the
# listener puts the boundary in the one place that can actually tell the two
# audiences apart, without adding an auth system to an app that has none.
#
# Note what this is *not*: it is not protection against someone who can reach
# port 80. Nothing here is. It is the difference between "shared with the
# internet" and "shared with the internet, read-only".

# Two limits, because they stop different things. limit_req caps the *rate* of
# requests, which is what a scraper walking /api/aircraft (6.6 MB a call) does;
# limit_conn caps concurrent sockets, which is what a client that opens hundreds
# of parallel requests and never reads them does. 10m of state holds ~160k
# distinct addresses.
#
# 20r/s with burst=60 is set against what a real page load costs: the map opens
# ~40 endpoints in a few seconds, then settles into a 3-minute poll. nodelay
# lets that opening burst through at once instead of drip-feeding it over three
# seconds, which is the difference between a map that paints and one that
# appears to hang.
limit_req_zone $binary_remote_addr zone=public_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=public_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# --- private: full access, via the SSH tunnel --------------------------------
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;
    include /etc/nginx/compression.conf;

    # The admin configuration is capped at 2 MB by the backend
    # (backend/admin_config.py's MAX_BYTES). nginx's default cap is 1 MB, which
    # would turn a large-but-legal configuration into a 413 from the proxy
    # rather than from the code that owns the rule. 4m leaves the backend as the
    # only thing deciding what is too big.
    client_max_body_size 4m;

    # Vite emits content-hashed asset filenames, so they can be cached hard.
    #
    # The security-headers include is repeated in every location that sets an
    # add_header of its own: nginx does not merge add_header across levels, it
    # replaces -- a location with one add_header silently drops every header
    # inherited from the server block.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # index.html is the one file whose name never changes, so it is the only
    # thing that can pin a browser to an old build: it names the hashed bundles,
    # and a cached copy keeps requesting yesterday's. Served with no Cache-Control
    # at all it only had Last-Modified, which lets a browser *heuristically*
    # cache it -- and that is precisely how someone opening a shared link ends up
    # staring at a version that was replaced hours ago.
    #
    # no-cache does not mean "do not store", it means "revalidate before use", so
    # the usual request is a conditional one answered with 304 and no body. The
    # hashed assets above are unaffected and stay immutable for a year.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Everything under /api goes to the backend container. Without this the
    # split deployment would need CORS plus absolute URLs in the frontend;
    # proxying instead keeps the browser on one origin and leaves
    # src/api.js's relative paths working exactly as they do when the
    # backend serves the bundle itself.
    location /api/ {
        include /etc/nginx/api-proxy.conf;
    }

    # The client asks for this at startup to find out which listener served it.
    # 404 here, 200 on the public one. Answered explicitly rather than left to
    # the SPA fallback below, which would return index.html with a 200 and make
    # "not found" indistinguishable from "found" by status alone.
    location = /public-mode {
        return 404;
    }

    # SPA fallback: the app is client-routed, so any unknown path must still
    # return index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- public: same app, read-only ---------------------------------------------
server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;
    include /etc/nginx/compression.conf;

    # Nothing on this listener accepts a body -- the one write endpoint is
    # refused below and every other route is a GET. A small cap means a POST
    # that was going to be rejected anyway is rejected before its body is read
    # rather than after, so a large upload cannot be used to spend the server's
    # bandwidth on its own refusal.
    client_max_body_size 8k;

    # Who the limits below are counting.
    #
    # Every request here arrives from cloudflared, so $remote_addr is the same
    # address for every reader on earth: a per-address limit would be one shared
    # bucket, and the first busy reader would throttle everyone. Cloudflare puts
    # the real client in CF-Connecting-IP, and realip rewrites
    # $binary_remote_addr from it so the limits count visitors.
    #
    # Trusting a client-supplied header is only safe because of who can set it:
    # 8081 is published on 127.0.0.1 alone (see docker-compose.yml), so the only
    # thing that can open a connection to it is a process on the host -- the
    # tunnel. The ranges below are the loopback/docker addresses such a
    # connection comes from; a request from anywhere else keeps its own address
    # and its header is ignored.
    #
    # Deliberately scoped to this server block rather than set globally: on the
    # private listener the header would be the SSH client's to invent, and there
    # is nothing there it should be allowed to influence.
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Applied at server level so it covers the bundle and the assets too, not
    # just /api: a flood of requests for index.html costs the same sockets as a
    # flood of requests for the aircraft feed.
    limit_req zone=public_api burst=60 nodelay;
    limit_conn public_conn 30;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # The whole point of this listener. An exact-match location, so it is chosen
    # ahead of the /api/ prefix below for this one path -- and `limit_except`
    # allows reads through while answering 403 to POST, PUT and everything else.
    #
    # GET stays open deliberately: the client fetches the configuration to draw
    # the map the way it was set up. Only changing it is refused.
    location = /api/admin-config {
        # Raised above this listener's 8k default so the REASON in the log is the true one.
        # The server-wide cap is evaluated as the body arrives and beat the deny below to the
        # answer, so a refused write was logged as "too large body" -- accurate about the size
        # and misleading about why it was rejected. The body is still never proxied: `deny`
        # answers 403 in the access phase, before anything is forwarded upstream.
        client_max_body_size 1m;
        limit_except GET HEAD {
            deny all;
        }
        include /etc/nginx/api-proxy.conf;
    }

    location /api/ {
        include /etc/nginx/api-proxy.conf;
    }

    # How the client learns it is on the public door, so it can hide Admin Mode
    # instead of offering a mode whose every save would 403.
    #
    # This is presentation, not enforcement: the 403 above is what actually stops
    # a write, and it stops curl as readily as it stops the panel. Hiding the
    # button is so a visitor is never invited into a mode that cannot work --
    # which is also why a client that fails to fetch this defaults to *offering*
    # admin rather than hiding it. Failing the other way would lock the operator
    # out of the panel over the SSH tunnel on a single dropped request, to
    # protect a boundary that nginx is already holding.
    location = /public-mode {
        default_type application/json;
        add_header Cache-Control "no-store";
        include /etc/nginx/security-headers.conf;
        return 200 '{"readonly":true}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
