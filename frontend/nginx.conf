server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything under /api goes to the backend container. Without this the
    # split deployment would need CORS plus absolute URLs in the frontend;
    # proxying instead keeps the browser on one origin and leaves
    # src/api.js's relative paths working exactly as they do when the
    # backend serves the bundle itself.
    location /api/ {
        # Docker's embedded DNS, and a *variable* upstream. Both halves matter:
        # with a literal `proxy_pass http://backend:8000` nginx resolves that
        # name once at startup and caches the address for the life of the
        # process, so the first `docker compose up -d --build backend` gives the
        # backend a new container IP and every request here 502s until the
        # frontend is restarted too -- the map goes down on a deploy that never
        # touched it. A variable forces resolution per request, and `valid=10s`
        # bounds how long a stale answer can survive.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://backend:8000;
        # No path after the port, deliberately: nginx then forwards the original
        # request URI unchanged, so /api/health stays /api/health.
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # FIRMS/cities responses run to tens of thousands of JSON objects and
        # the weather endpoints stream PNG tiles -- buffering whole responses
        # in nginx before forwarding adds latency for no benefit here.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # SPA fallback: the app is client-routed, so any unknown path must still
    # return index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
