# Two entry points to the same app, differing in one thing: whether the admin
# configuration can be written.
#
#   :80    private. Reached only through an SSH tunnel to the host, so whoever
#          holds the server's SSH key gets the app exactly as it has always
#          behaved, admin panel included.
#   :8081  public. What the Cloudflare tunnel points at. Identical, except that
#          writes to /api/admin-config are refused.
#
# The reason for the split: POST/PUT /api/admin-config is the only write endpoint
# in the API and it has no authentication of its own (see backend/app.py). It
# stores the whole configuration object -- layer setup, border edits -- so on a
# public link, any visitor could rewrite the map for everyone. Splitting the
# listener puts the boundary in the one place that can actually tell the two
# audiences apart, without adding an auth system to an app that has none.
#
# Note what this is *not*: it is not protection against someone who can reach
# port 80. Nothing here is. It is the difference between "shared with the
# internet" and "shared with the internet, read-only".

# --- private: full access, via the SSH tunnel --------------------------------
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is the one file whose name never changes, so it is the only
    # thing that can pin a browser to an old build: it names the hashed bundles,
    # and a cached copy keeps requesting yesterday's. Served with no Cache-Control
    # at all it only had Last-Modified, which lets a browser *heuristically*
    # cache it -- and that is precisely how someone opening a shared link ends up
    # staring at a version that was replaced hours ago.
    #
    # no-cache does not mean "do not store", it means "revalidate before use", so
    # the usual request is a conditional one answered with 304 and no body. The
    # hashed assets above are unaffected and stay immutable for a year.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Everything under /api goes to the backend container. Without this the
    # split deployment would need CORS plus absolute URLs in the frontend;
    # proxying instead keeps the browser on one origin and leaves
    # src/api.js's relative paths working exactly as they do when the
    # backend serves the bundle itself.
    location /api/ {
        include /etc/nginx/api-proxy.conf;
    }

    # The client asks for this at startup to find out which listener served it.
    # 404 here, 200 on the public one. Answered explicitly rather than left to
    # the SPA fallback below, which would return index.html with a 200 and make
    # "not found" indistinguishable from "found" by status alone.
    location = /public-mode {
        return 404;
    }

    # SPA fallback: the app is client-routed, so any unknown path must still
    # return index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- public: same app, read-only ---------------------------------------------
server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The whole point of this listener. An exact-match location, so it is chosen
    # ahead of the /api/ prefix below for this one path -- and `limit_except`
    # allows reads through while answering 403 to POST, PUT and everything else.
    #
    # GET stays open deliberately: the client fetches the configuration to draw
    # the map the way it was set up. Only changing it is refused.
    location = /api/admin-config {
        limit_except GET HEAD {
            deny all;
        }
        include /etc/nginx/api-proxy.conf;
    }

    location /api/ {
        include /etc/nginx/api-proxy.conf;
    }

    # How the client learns it is on the public door, so it can hide Admin Mode
    # instead of offering a mode whose every save would 403.
    #
    # This is presentation, not enforcement: the 403 above is what actually stops
    # a write, and it stops curl as readily as it stops the panel. Hiding the
    # button is so a visitor is never invited into a mode that cannot work --
    # which is also why a client that fails to fetch this defaults to *offering*
    # admin rather than hiding it. Failing the other way would lock the operator
    # out of the panel over the SSH tunnel on a single dropped request, to
    # protect a boundary that nginx is already holding.
    location = /public-mode {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"readonly":true}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
