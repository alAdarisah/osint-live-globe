server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything under /api goes to the backend container. Without this the
    # split deployment would need CORS plus absolute URLs in the frontend;
    # proxying instead keeps the browser on one origin and leaves
    # src/api.js's relative paths working exactly as they do when the
    # backend serves the bundle itself.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # FIRMS/cities responses run to tens of thousands of JSON objects and
        # the weather endpoints stream PNG tiles -- buffering whole responses
        # in nginx before forwarding adds latency for no benefit here.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # SPA fallback: the app is client-routed, so any unknown path must still
    # return index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
