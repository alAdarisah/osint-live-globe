# Compression, and the two different jobs it has to do here.
#
# Nothing was compressed before this file existed. The nginx:alpine image ships
# `#gzip on;` commented out in its main config, and the only compression anywhere
# was the backend's own GZipMiddleware -- which covers /api responses and cannot
# touch a static asset, because those are served by nginx and never reach Python.
# Measured on a real page load of the deployment: 1,634 KB of JavaScript and
# 106 KB of CSS, all of it with encodedBodySize == decodedBodySize. Uncompressed,
# every visit, on a bundle that gzips to about a quarter of that.
#
#   gzip_static   the assets. Vite's output is content-hashed and immutable, so
#                 the right time to compress it is once, at build time, at the
#                 highest level -- see the Dockerfile. nginx then serves the .gz
#                 sibling with no per-request CPU at all, and falls back to
#                 compressing on the fly if a file has no sibling.
#   gzip          everything else, which is the proxied /api responses.
#
# The API half is belt-and-braces rather than the main event: the backend already
# gzips anything over 1 KB, and nginx will not re-compress a response that
# arrives with Content-Encoding set. It matters for the endpoints under that
# threshold, for any future response the backend does not compress, and as the
# thing that keeps working if the middleware is ever removed.
gzip on;
gzip_static on;

# 6 is where the curve flattens for JSON: measured on this app's own payloads,
# level 9 buys under 2% over level 6 for roughly double the CPU, and these are
# multi-megabyte responses being compressed inside a request.
gzip_comp_level 6;

# Below a kilobyte the header overhead and the CPU are not worth it, and the
# result is frequently larger than the input. Same threshold the backend's own
# GZipMiddleware uses, deliberately.
gzip_min_length 1024;

# Compress what we proxy. Without this nginx refuses to compress any response
# that carries Via or an auth header -- which is every response through the API
# proxy -- and the directive silently does nothing.
gzip_proxied any;

# text/html is always compressed and cannot be listed. Everything else this app
# actually serves has to be named: the default is text/html alone, which is why
# a config with `gzip on` and nothing else compresses none of the bundle.
gzip_types
    application/javascript
    text/javascript
    application/json
    application/geo+json
    text/css
    text/plain
    text/xml
    application/xml
    image/svg+xml;

# Caches and the Cloudflare tunnel in front of the public listener both key on
# this. Without it, one client that cannot decompress can poison a shared cache
# for one that can.
gzip_vary on;
