# Shared /api proxy directives, included by both listeners in nginx.conf.
#
# Factored out rather than duplicated because there are now two entry points --
# the private one on 80 and the public one on 8081 -- and the difference between
# them must be *only* which methods are allowed. Two copies of this block would
# eventually disagree about a timeout or a header, and the resulting bug would
# look like "the map works over SSH but not on the link", which is the hardest
# kind to reason about.

# Docker's embedded DNS, and a *variable* upstream. Both halves matter: with a
# literal `proxy_pass http://backend:8000` nginx resolves that name once at
# startup and caches the address for the life of the process, so the first
# `docker compose up -d --build backend` gives the backend a new container IP and
# every request here 502s until the frontend is restarted too -- the map goes
# down on a deploy that never touched it. A variable forces resolution per
# request, and `valid=10s` bounds how long a stale answer can survive.
resolver 127.0.0.11 valid=10s ipv6=off;
set $upstream http://backend:8000;
# No path after the port, deliberately: nginx then forwards the original request
# URI unchanged, so /api/health stays /api/health.
proxy_pass $upstream;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# FIRMS/cities responses run to tens of thousands of JSON objects and the weather
# endpoints stream PNG tiles -- buffering whole responses in nginx before
# forwarding adds latency for no benefit here.
proxy_buffering off;
proxy_read_timeout 120s;
