# Response headers that constrain what a browser will do with this page.
# Included by both listeners in nginx.conf, and repeated inside every location
# that sets an add_header of its own -- nginx replaces rather than merges
# add_header between levels, so a location with one Cache-Control header would
# otherwise silently ship with no security headers at all.
#
# `always` on every one of them: without it nginx omits the header on error
# responses, and a 404 or a 500 renders in the same browser as a 200.

# What the map is actually allowed to load. Every host here is one the app
# already talks to; the value of writing them down is that nothing *else* can be
# loaded, so a script injected through a feed record has nowhere to send what it
# reads and no way to pull more code in.
#
#   script-src   'self' and nothing else. Leaflet and its plugins are served
#                from public/vendor/ (see the README there), so there is no
#                third-party origin injected markup could pull code from -- which
#                is the difference between a policy that narrows an attack and
#                one that closes it.
#   style-src    'unsafe-inline' is required for React's style={{...}} attributes.
#                It permits inline *styles*, not inline scripts.
#   img-src      the basemap (carto), the rain radar, NASA's GIBS imagery, plus
#                data: for the inline favicon/icons and blob: for the admin
#                panel's configuration export.
#   connect-src  'self' covers every /api call; rainviewer's JSON index is the
#                one fetch that leaves our origin.
#   frame-ancestors 'none'  no site may frame the map -- the modern replacement
#                for X-Frame-Options, and the one that also covers nested frames.
#   object-src 'none', base-uri 'self', form-action 'self'  close the three
#                classic ways injected markup regains control of the page.
#
# Deliberately absent: upgrade-insecure-requests. It was here, and it took the
# admin map down to a grey screen the moment the private listener stopped being
# reached at localhost.
#
# The directive rewrites every http subresource URL to https. That was harmless
# while the private listener was reached through an SSH tunnel, because browsers
# treat localhost as a potentially-trustworthy origin and never upgrade it. The
# tailnet moved private access to http://osint-server.<tailnet>.ts.net:8080 --
# a real hostname over plain HTTP, so not a secure context -- and every
# same-origin request the page made was upgraded to https on a port where nginx
# speaks only http. The bundle, the stylesheet and all four vendor scripts
# failed to load; nothing rendered, and the server log showed a single 200 for
# the document and nothing else, because the browser never sent the rest.
#
# It costs nothing to leave out. Every URL this policy admits is either
# same-origin or already written https:// above, so on the Cloudflare-fronted
# public listener there is no http URL left for it to upgrade -- it was
# protecting against a mixed-content case the policy already forbids.
#
# If a plain-HTTP listener ever goes away, this is safe to restore. While one
# exists, this include is shared by both listeners (see nginx.conf) and the
# directive cannot be correct for both.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://tilecache.rainviewer.com https://gibs.earthdata.nasa.gov; connect-src 'self' https://api.rainviewer.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Kept alongside frame-ancestors for browsers that predate CSP level 2.
add_header X-Frame-Options "DENY" always;

# Stops a browser from second-guessing a Content-Type. It matters most for the
# JSON the API returns: sniffed as HTML, a feed record containing markup becomes
# a page that executes in our origin.
add_header X-Content-Type-Options "nosniff" always;

# The public URL is a Cloudflare quick-tunnel hostname that is not meant to be
# passed around. Sending only the origin -- and nothing at all to plain HTTP --
# keeps the full path out of the logs of every external tile server and link
# target the map touches.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The map needs none of these. Denying them means a prompt can never appear,
# rather than appearing and being declined.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;

# Deliberately not here: Strict-Transport-Security. The private listener is
# reached over plain HTTP through an SSH tunnel on localhost, and an HSTS header
# would pin the browser's idea of localhost to HTTPS for every other project on
# this machine. Cloudflare already serves the public hostname over HTTPS with
# its own HSTS.
