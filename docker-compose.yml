# The whole stack: Postgres for durable storage, an ingest process that owns
# every credentialed or metered outbound call, the FastAPI backend as a pure
# API, and the React app behind nginx (which proxies /api to the backend, so
# the browser only ever talks to one origin). Alongside it, a read-only
# monitoring trio -- postgres-exporter, Prometheus and Grafana -- that watches
# the database and touches nothing.
#
#   docker compose up --build      -> app at http://localhost:8080
#                                     Grafana at http://localhost:3000
#
# This is the only supported way to run the app. The single-container path
# (root Dockerfile + render.yaml) and the plain run.bat process were both
# removed when ingest split out: neither has anywhere to put the ingest
# process, and run.bat has no Postgres at all, so under the split both would
# have shown five permanently empty layers.

services:
  postgres:
    image: postgres:16-alpine
    # Streaming-replication settings for the Phase 1 read replica (see
    # docs/plans/2026-08-09-read-replica.md and ops/postgres/README.md). All
    # three are safe on the existing 13 GB volume: wal_level=replica and
    # max_wal_senders=10 are already the PG16 defaults, and max_replication_slots
    # only reserves a little shared memory. They change nothing until a standby
    # actually connects. The replication ROLE and slot are NOT created by these
    # flags -- on a fresh volume the init script below creates them; on the
    # existing populated volume that is the one-time manual step in the README.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-osint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osint}
      POSTGRES_DB: ${POSTGRES_DB:-osint}
      # Password for the streaming-replication role. Only consumed by the init
      # script on a fresh volume; override in .env before the first `up` to use
      # something other than the default.
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs ONLY on a fresh data dir: creates the `replicator` role, a physical
      # slot, and the replication pg_hba line. A no-op on the populated volume,
      # which is why the README documents the manual equivalent.
      - ./ops/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Exposed so the migration script and psql/GUI clients can reach it
      # from the host. Drop this line if you don't need that.
      - "127.0.0.1:5432:5432"
    healthcheck:
      # The backend depends on this rather than on the container merely
      # existing -- Postgres accepts connections only after initdb finishes,
      # which is well after the container starts.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osint} -d ${POSTGRES_DB:-osint}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # A process inside this container cannot gain privileges it did not start
    # with -- setuid binaries and file capabilities stop working as an escalation
    # step. Nothing here relies on either, so this costs nothing and removes the
    # usual second half of a container escape.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Read replica -- a physical streaming standby of `postgres` (Phase 1 of
  # docs/plans/2026-08-09-read-replica.md). It exists to (a) be a hot,
  # always-current second copy for durability/failover and (b) take heavy
  # lag-tolerant reads (backups, monitoring, analytics) off the write-heavy
  # primary. Nothing in the app routes to it yet -- that is Phase 2/3. It is
  # read-only by nature, so a write accidentally sent here fails loud.
  #
  # It must NEVER be given the live serve path: LISTEN/NOTIFY does not reach a
  # replica, so the mirror's sub-second wakeups (backend/mirror.py) would go
  # deaf on it, and a lagging replica split from the watermark read would serve
  # stale data as fresh. See the plan's "two landmines" section.
  postgres-replica:
    image: postgres:16-alpine
    user: postgres
    environment:
      # libpq honours PGPASSWORD for both the one-off pg_basebackup seed and the
      # standby's ongoing walreceiver connection (which inherits the postmaster
      # environment), so this one variable authenticates the whole stream.
      PGPASSWORD: ${REPLICATION_PASSWORD:-replicator}
    depends_on:
      # Waits for the primary to be accepting connections. On a fresh stack the
      # primary's init script has already created the role + slot by the time it
      # reports healthy, so the base backup below can authenticate immediately.
      postgres:
        condition: service_healthy
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        # First boot only: a fresh named volume is an empty, postgres-owned
        # mountpoint, so seed it from the primary. -R writes standby.signal +
        # primary_conninfo, -S binds the physical slot so the primary keeps WAL
        # for us, -Xs streams WAL during the copy so the backup is consistent.
        # On every later boot PG_VERSION exists and we just start streaming.
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          rm -rf "$$PGDATA"/* 2>/dev/null || true
          pg_basebackup -h postgres -p 5432 -U replicator -D "$$PGDATA" -Fp -Xs -P -R -S standby_1
        fi
        # The volume's mountpoint is created 0755 and pg_basebackup only sets
        # modes *inside* it, so without this the postmaster refuses to start:
        # "data directory has invalid permissions ... should be u=rwx (0700)".
        # The official entrypoint does this for the primary; this service
        # replaces the entrypoint, so it has to do it itself. Unconditional and
        # idempotent -- the same 0755 comes back on any later fresh volume.
        chmod 0700 "$$PGDATA"
        exec postgres -c hot_standby=on
    ports:
      # Host access for backups/psql, mirroring the primary's 5432. Bound to
      # localhost only, like everything else in this stack.
      - "127.0.0.1:5433:5432"
    healthcheck:
      # Passes once the standby is accepting read-only connections; fails during
      # the initial base backup, which is correct -- it is not usable yet then.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osint} -d ${POSTGRES_DB:-osint}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # A process inside this container cannot gain privileges it did not start
    # with -- setuid binaries and file capabilities stop working as an escalation
    # step. Nothing here relies on either, so this costs nothing and removes the
    # usual second half of a container escape.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Read replica -- a physical streaming standby of `postgres`. It exists to (a)
  # be a hot, always-current second copy for durability/failover and (b) take
  # heavy lag-tolerant reads (backups, monitoring, analytics) off the write-heavy
  # primary. It is read-only by nature, so a write accidentally sent here fails
  # loud.
  #
  # It must NEVER be given the live serve path: LISTEN/NOTIFY does not reach a
  # replica, so the mirror's sub-second wakeups (backend/mirror.py) would go deaf
  # on it, and a lagging replica split from the watermark read would serve stale
  # data as fresh.
  #
  # Two things this deliberately does NOT carry, both of which the version this
  # was restored from had:
  #
  #   * the primary's `command:` with wal_level=replica / max_wal_senders=10 /
  #     max_replication_slots=10. All three are already the PG16 defaults, which
  #     is why the standby streams happily from a primary running a bare
  #     `postgres` -- verified against the running container. Adding them back
  #     would be a no-op that forces compose to recreate a 13 GB primary.
  #   * the ./ops/postgres/initdb bind mount, which creates the `replicator` role
  #     and the physical slot on a *fresh* volume only. ops/ is not part of what
  #     "Deploy Code to Server.bat" ships, so the mount would resolve to an empty
  #     directory anywhere the script has not already been placed by hand. On a
  #     genuinely fresh stack the role and slot are the one manual step.
  postgres-replica:
    image: postgres:16-alpine
    user: postgres
    environment:
      # libpq honours PGPASSWORD for both the one-off pg_basebackup seed and the
      # standby's ongoing walreceiver connection (which inherits the postmaster
      # environment), so this one variable authenticates the whole stream.
      PGPASSWORD: ${REPLICATION_PASSWORD:-replicator}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        # First boot only: a fresh named volume is an empty, postgres-owned
        # mountpoint, so seed it from the primary. -R writes standby.signal +
        # primary_conninfo, -S binds the physical slot so the primary keeps WAL
        # for us, -Xs streams WAL during the copy so the backup is consistent.
        # On every later boot PG_VERSION exists and we just start streaming.
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          rm -rf "$$PGDATA"/* 2>/dev/null || true
          pg_basebackup -h postgres -p 5432 -U replicator -D "$$PGDATA" -Fp -Xs -P -R -S standby_1
        fi
        # The volume's mountpoint is created 0755 and pg_basebackup only sets
        # modes *inside* it, so without this the postmaster refuses to start:
        # "data directory has invalid permissions ... should be u=rwx (0700)".
        # The official entrypoint does this for the primary; this service
        # replaces the entrypoint, so it has to do it itself. Unconditional and
        # idempotent -- the same 0755 comes back on any later fresh volume.
        chmod 0700 "$$PGDATA"
        exec postgres -c hot_standby=on
    ports:
      # Host access for backups/psql, mirroring the primary's 5432. Bound to
      # localhost only, like everything else in this stack.
      - "127.0.0.1:5433:5432"
    healthcheck:
      # Passes once the standby is accepting read-only connections; fails during
      # the initial base backup, which is correct -- it is not usable yet then.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osint} -d ${POSTGRES_DB:-osint}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # A process inside this container cannot gain privileges it did not start
    # with -- setuid binaries and file capabilities stop working as an escalation
    # step. Nothing here relies on either, so this costs nothing and removes the
    # usual second half of a container escape.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  backend:
    build:
      # Repo root, so the image can COPY both requirements.txt and backend/.
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-osint}:${POSTGRES_PASSWORD:-osint}@postgres:5432/${POSTGRES_DB:-osint}
      REDIS_URL: redis://redis:6379/0
    env_file:
      # Only OWM_API_KEY is still read here -- the weather tile proxy is the one
      # credentialed thing the backend does itself, because it is served
      # on-demand per tile rather than polled. Every other key belongs to the
      # ingest container now. Optional, as before: a missing key degrades that
      # one feature rather than stopping the stack.
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Read-write, unlike the migrate service's copy below: Admin Mode saves
      # its configuration to data/admin_config.json (see backend/admin_config.py)
      # and every client reads it back at startup, so without a bind mount here
      # a configuration would live inside the container and disappear with it.
      #
      # This is the *only* state outside Postgres. Everything the app collects
      # goes to the database (see backend/storage.py) and is read back on the
      # next start, so the pgdata volume below is what has to survive, not this.
      - ./data:/app/data
    healthcheck:
      # No curl in python:3.12-slim, and adding one would mean a package layer
      # for a single request. /api/health is served from in-memory registry
      # state and never touches Postgres, so it answers as soon as the app is
      # actually accepting requests -- which is precisely what the frontend
      # needs to know before it starts proxying.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s
    # A process inside this container cannot gain privileges it did not start
    # with -- setuid binaries and file capabilities stop working as an escalation
    # step. Nothing here relies on either, so this costs nothing and removes the
    # usual second half of a container escape.
    security_opt:
      - no-new-privileges:true
    # Pure Python talking to Postgres and Redis: it binds no privileged port,
    # changes no file ownership and loads no kernel module, so it needs no Linux
    # capability at all.
    cap_drop:
      - ALL
    restart: unless-stopped

  # Read-through cache in front of Postgres for the payloads the backend serves
  # (see backend/cachestore.py). Holds only what was derived from the database,
  # so it is safe to lose entirely: `docker compose stop redis` degrades to
  # reading Postgres directly and nothing else changes.
  redis:
    image: redis:7-alpine
    # allkeys-lru rather than the default noeviction: every key here is a
    # rebuildable copy of something in Postgres, so dropping the least useful
    # one under pressure is exactly right, whereas noeviction would start
    # refusing writes and turn a full cache into a permanent one.
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # A process inside this container cannot gain privileges it did not start
    # with -- setuid binaries and file capabilities stop working as an escalation
    # step. Nothing here relies on either, so this costs nothing and removes the
    # usual second half of a container escape.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Owns ACLED, FIRMS, ADS-B, AIS and the Overpass sweep -- everything that
  # costs credentials, credits or a volunteer service's patience. Nothing else
  # in the stack holds those keys, which is the point: with the pollers inside
  # the backend, every restart and redeploy re-spent the quota.
  #
  # Deliberately one instance. A second copy doubles the spend on every metered
  # source, so if this ever moves somewhere that scales services by default,
  # pin it to one replica there too.
  ingest:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-osint}:${POSTGRES_PASSWORD:-osint}@postgres:5432/${POSTGRES_DB:-osint}
    env_file:
      # The same keys the backend used to read. It no longer needs them --
      # nothing in that process makes a credentialed call any more -- but they
      # stay in one shared .env rather than being split in two, because a key
      # that silently reaches only one container is far harder to diagnose than
      # one that reaches both and is used by one.
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    # No ports: it serves nothing. No volumes: everything it produces goes to
    # Postgres, and it reads no local state.
    command: ["python", "-m", "backend.ingest"]
    # A process inside this container cannot gain privileges it did not start
    # with -- setuid binaries and file capabilities stop working as an escalation
    # step. Nothing here relies on either, so this costs nothing and removes the
    # usual second half of a container escape.
    security_opt:
      - no-new-privileges:true
    # Pure Python talking to Postgres and Redis: it binds no privileged port,
    # changes no file ownership and loads no kernel module, so it needs no Linux
    # capability at all.
    cap_drop:
      - ALL
    restart: unless-stopped

  # Derives new facts from stored ones: fuses ACLED/UCDP/GDELT into one record
  # per incident, finds AIS gaps and ship-to-ship pairs in the movement log, and
  # ranks escalating regions. Reads Postgres, writes Postgres, calls nothing --
  # it holds no credentials at all, which is why it can be restarted or killed
  # freely where the ingest container cannot.
  #
  # Separated from the backend because fusion is ~1600 lines of clustering and
  # geo-reconciliation that was sharing an event loop with every map request.
  refine:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-osint}:${POSTGRES_PASSWORD:-osint}@postgres:5432/${POSTGRES_DB:-osint}
      # Routes only dark_vessels' heavy AIS reads (the 15M-row position-gap scan)
      # to the read replica -- writes and every read that must be current stay on
      # the primary via DATABASE_URL. Safe by construction: storage.init_read_pool
      # falls back to the primary if the replica is down or still seeding, so this
      # is a no-op until a healthy standby exists. NOT a depends_on -- refine must
      # never wait on the replica to start.
      READ_REPLICA_URL: postgresql://${POSTGRES_USER:-osint}:${POSTGRES_PASSWORD:-osint}@postgres-replica:5432/${POSTGRES_DB:-osint}
    depends_on:
      postgres:
        condition: service_healthy
    # No env_file: nothing here reads an API key, and not passing them is the
    # cheapest way to keep that true.
    command: ["python", "-m", "backend.refine"]
    # A process inside this container cannot gain privileges it did not start
    # with -- setuid binaries and file capabilities stop working as an escalation
    # step. Nothing here relies on either, so this costs nothing and removes the
    # usual second half of a container escape.
    security_opt:
      - no-new-privileges:true
    # Pure Python talking to Postgres and Redis: it binds no privileged port,
    # changes no file ownership and loads no kernel module, so it needs no Linux
    # capability at all.
    cap_drop:
      - ALL
    restart: unless-stopped

  # Watches the cache and the two producing processes, and reports what is wrong
  # to the log, the alerts table and (if ALERT_WEBHOOK_URL is set) a webhook.
  #
  # It repairs nothing -- see backend/cacheworker. Repopulating a missing key
  # from here would hide the only symptom of a backend that has lost Redis, and
  # would make this a second writer of keys the backend owns.
  cache-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-osint}:${POSTGRES_PASSWORD:-osint}@postgres:5432/${POSTGRES_DB:-osint}
      REDIS_URL: redis://redis:6379/0
    env_file:
      # For ALERT_WEBHOOK_URL only. Unset means the log and the alerts table,
      # which is a complete configuration -- the webhook is the one sink that
      # reaches someone not looking at the map.
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "backend.cacheworker"]
    # A process inside this container cannot gain privileges it did not start
    # with -- setuid binaries and file capabilities stop working as an escalation
    # step. Nothing here relies on either, so this costs nothing and removes the
    # usual second half of a container escape.
    security_opt:
      - no-new-privileges:true
    # Pure Python talking to Postgres and Redis: it binds no privileged port,
    # changes no file ownership and loads no kernel module, so it needs no Linux
    # capability at all.
    cap_drop:
      - ALL
    restart: unless-stopped

  # --- Monitoring -----------------------------------------------------------
  #
  # Three containers that observe the stack and change nothing in it. They read
  # Postgres' own statistics views and scrape over the compose network; no
  # application code, no schema and no collector behaviour depends on them, so
  # `docker compose stop prometheus postgres-exporter grafana` costs you the
  # graphs and nothing else.
  #
  # Deliberately separate from /api/health and the alerts table, which answer a
  # different question: those say whether a *source* is producing, this says
  # whether the *database* is coping. A source can be perfectly healthy while
  # Postgres is drowning, and vice versa.

  # Turns pg_stat_database, pg_stat_user_tables, pg_locks, pg_stat_bgwriter and
  # pg_settings into Prometheus metrics, plus the session/lock/transaction-age
  # queries in monitoring/postgres-exporter/queries.yaml.
  #
  # It connects as the same superuser the app uses, which is what gives it
  # visibility into every session rather than only its own. That is fine for a
  # local stack; anywhere else, make it a dedicated role with pg_monitor and
  # nothing more.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      # sslmode=disable because this connection never leaves the compose
      # network. Postgres here has no server certificate, so any other value
      # fails the handshake outright.
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-osint}:${POSTGRES_PASSWORD:-osint}@postgres:5432/${POSTGRES_DB:-osint}?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yaml
    volumes:
      - ./monitoring/postgres-exporter/queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    # Not published to the host: only Prometheus needs it, and it is reachable
    # by service name inside the network. Add `ports: ["9187:9187"]` if you want
    # to curl the raw metrics while debugging a missing panel.
    expose:
      - "9187"
    # A process inside this container cannot gain privileges it did not start
    # with -- setuid binaries and file capabilities stop working as an escalation
    # step. Nothing here relies on either, so this costs nothing and removes the
    # usual second half of a container escape.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # The same exporter pointed at the read replica, so the standby's own liveness
  # and size are visible and a failed scrape means the replica is down. It runs
  # built-ins only (no PG_EXPORTER_EXTEND_QUERY_PATH): the replica-specific WAL
  # functions differ from the primary's, and the authoritative lag number
  # already lives on the primary exporter's pg_replication query. Harmless when
  # no replica is running -- the scrape simply reports the target down.
  postgres-exporter-replica:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-osint}:${POSTGRES_PASSWORD:-osint}@postgres-replica:5432/${POSTGRES_DB:-osint}?sslmode=disable
    depends_on:
      postgres-replica:
        condition: service_healthy
    expose:
      - "9187"
    # A process inside this container cannot gain privileges it did not start
    # with -- setuid binaries and file capabilities stop working as an escalation
    # step. Nothing here relies on either, so this costs nothing and removes the
    # usual second half of a container escape.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # The same exporter pointed at the read replica, so the standby's own liveness
  # and size are visible and a failed scrape means the replica is down. It runs
  # built-ins only (no PG_EXPORTER_EXTEND_QUERY_PATH): the replica-specific WAL
  # functions differ from the primary's, and the authoritative lag number already
  # lives on the primary exporter's pg_replication query. Harmless when no replica
  # is running -- the scrape simply reports the target down.
  postgres-exporter-replica:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-osint}:${POSTGRES_PASSWORD:-osint}@postgres-replica:5432/${POSTGRES_DB:-osint}?sslmode=disable
    depends_on:
      postgres-replica:
        condition: service_healthy
    expose:
      - "9187"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15 days at a 15s interval and this metric count is a few hundred MB --
      # enough to see a week-long size trend without the volume becoming the
      # largest thing on disk after pgdata.
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      # For ad-hoc PromQL and checking Status -> Targets when a panel is empty.
      - "127.0.0.1:9090:9090"
    depends_on:
      - postgres-exporter
    # A process inside this container cannot gain privileges it did not start
    # with -- setuid binaries and file capabilities stop working as an escalation
    # step. Nothing here relies on either, so this costs nothing and removes the
    # usual second half of a container escape.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Default admin/admin, and Grafana will not force a change because the
      # password came from provisioning. Set GRAFANA_ADMIN_PASSWORD in .env
      # before exposing port 3000 to anything but this machine.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # No outbound calls: no update checks, no analytics, and the plugin
      # catalogue off, so the container works identically offline.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      # Datasource and dashboard provider definitions, read once at startup.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # The dashboard JSON itself, re-read every 30s (see the provider config),
      # so editing the file on the host updates the dashboard without a restart.
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    # A process inside this container cannot gain privileges it did not start
    # with -- setuid binaries and file capabilities stop working as an escalation
    # step. Nothing here relies on either, so this costs nothing and removes the
    # usual second half of a container escape.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        # Waiting on the container merely *existing* meant nginx started
        # proxying before uvicorn was listening, and every request in that
        # window came back 502 -- which looks exactly like a broken API rather
        # than one that has not finished starting.
        condition: service_healthy
    ports:
      # Both on localhost: nothing here is meant to be reachable from the
      # internet directly. What differs is who gets to the two listeners.
      #
      # 8080 -> :80    the app with full access, including the admin panel.
      #                Reached by `ssh -L 8080:localhost:8080`, so the gate is
      #                possession of the server's SSH key.
      # 8081 -> :8081  the read-only listener, which is what the Cloudflare
      #                tunnel points at. Writes to /api/admin-config are refused
      #                there -- see frontend/nginx.conf for why that endpoint in
      #                particular.
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8081:8081"
    # A process inside this container cannot gain privileges it did not start
    # with -- setuid binaries and file capabilities stop working as an escalation
    # step. Nothing here relies on either, so this costs nothing and removes the
    # usual second half of a container escape.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # One-off SQLite -> Postgres import. Not part of the default stack (it sits
  # behind a profile), run explicitly once:
  #
  #   docker compose --profile migrate run --rm migrate
  #
  # data/ is bind-mounted rather than baked into the image: it's gitignored,
  # excluded by .dockerignore, and 1.5 GB -- nothing that belongs in a layer.
  # Read-only, and the script never deletes anything, so the SQLite file
  # remains a rollback path afterwards.
  migrate:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-osint}:${POSTGRES_PASSWORD:-osint}@postgres:5432/${POSTGRES_DB:-osint}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "backend.migrate_sqlite_to_postgres"]
    # The same two restrictions every other Python service here runs under. It
    # matters no less for being a one-off: this is the container that reads a
    # 1.5 GB file the app did not produce.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  # Named, so it survives `docker compose down`, an image rebuild and a host
  # reboot. This is where everything the app has ever collected lives -- every
  # source writes here and reads its own data back at startup -- so `down -v`
  # is the one command that throws the collected history away.
  pgdata:

  # The read replica's own full copy of the data, seeded once by pg_basebackup
  # and kept current by streaming. Budget the same size as pgdata (~13 GB now).
  # Losing it costs only the standby: `docker compose up` re-seeds it from the
  # primary. `down -v` drops it along with pgdata.
  pgdata-replica:

  # Metric history and Grafana's own state (users, preferences, starred
  # dashboards). Both are safe to lose: the dashboard is provisioned from a file
  # in the repo and re-appears on the next start, and losing the time series
  # costs graph history, not data. Kept as named volumes anyway so a rebuild
  # does not reset the graphs every time.
  prometheus-data:
  grafana-data:
