services:
  - type: web
    name: osint-live-globe
    runtime: docker
    plan: free
    envVars:
      - key: FIRMS_MAP_KEY
        sync: false
      - key: AISSTREAM_API_KEY
        sync: false
      - key: OPENSKY_CLIENT_ID
